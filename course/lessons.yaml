    'no': 12-4
    title: 킬 스위치·토큰 일괄 폐기·MCP 차단·요금 차단
  - id: s12-05
    'no': 12-5
    title: 사고 대응 한 장과 레드팀 콘솔 20개 모두 그린
- section: 13
  title: 완성과 출시
  lessons:
  - id: s13-01
    'no': 13-1
    title: '고객 한 명의 하루: 문의 → 환불 → 배송 → 리포트로 실사용 투어'
  - id: s13-02
    'no': 13-2
    title: 레드팀 콘솔 replay를 CI 게이트로
  - id: s13-03
    'no': 13-3
    title: '내 데이터로 바꾸기: CSV를 SQLite로, 내 도메인 도구 하나 더하기'
